[project]
name = "career-agent"
version = "0.1.0"
description = "JumysAI Career Agent - autonomous job-search agent (CSS 4007 final project)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
career-agent = "career_agent.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
